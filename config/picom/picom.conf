# ==============================================================================
# Picom Compositor Configuration
# Smooth window animations, crisp white active outline, clean rounded corners
# ==============================================================================

# Backend & Performance
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;
use-ewmh-active-win = true;

# Crisp Window Outline / Border on All Windows
shadow = true;
shadow-radius = 3;
shadow-opacity = 0.90;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "#5294E2";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'xfce4-panel'",
    "class_g = 'cinnamon'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Fading Animations
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;
fade-exclude = [
    "class_g = 'Polybar'"
];

# Window Opacity & Inactive Dimming
inactive-dim = 0.10;
inactive-dim-fixed = true;
focus-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'xfce4-panel'",
    "class_g = 'cinnamon'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Corner Radius
corner-radius = 4;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'xfce4-panel'",
    "class_g = 'cinnamon'"
];

# Window Types
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.98; };
    dropdown_menu = { opacity = 0.98; };
};
