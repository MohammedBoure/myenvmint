# ==============================================================================
# Starship Prompt Configuration - Sleek & Modern Minimalist Preset
# ==============================================================================

# Inserts a blank line between shell prompts
add_newline = true

# Character / Prompt Symbol
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# Directory formatting
[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
read_only = " 🔒"
read_only_style = "red"

# Git Branch
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

# Git Status
[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Command Execution Duration
[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

# Python environment
[python]
symbol = "🐍 "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

# Node.js
[nodejs]
symbol = "⬢ "
style = "bold green"
format = 'via [$symbol($version )]($style)'

# Rust
[rust]
symbol = "🦀 "
style = "bold red"
format = 'via [$symbol($version )]($style)'

# Package version
[package]
disabled = true
