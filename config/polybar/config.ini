; ==============================================================================
; Polybar Configuration - Modern Minimalist Top Bar
; ==============================================================================

[colors]
background = #1e1e2e
background-alt = #282a36
card-bg = #252839
card-active = #3a3f4b
foreground = #cdd6f4
foreground-dim = #6c7086
primary = #89b4fa
secondary = #cba6f7
cpu = #89b4fa
ram = #a6e3a1
kbd = #f9e2af
net = #94e2d5
data = #fab387
time = #cba6f7
alert = #f38ba8
border = #313244
separator = #45475a

[bar/main]
width = 100%
height = 28
radius = 0

dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

border-bottom-size = 1
border-bottom-color = ${colors.border}

padding-left = 1
padding-right = 1

module-margin = 1

separator = "│"
separator-foreground = ${colors.separator}

font-0 = "JetBrains Mono:style=Bold:size=9.5;2"
font-1 = "FontAwesome:style=Regular:size=10;2"
font-2 = "DejaVu Sans:size=9.5;2"

modules-left = xworkspaces
modules-center = date
modules-right = cpu memory network traffic-today xkeyboard

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = generic
override-redirect = false

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click = true
enable-scroll = true

format = <label-state>

label-active = %index%
label-active-foreground = #ffffff
label-active-background = ${colors.card-active}
label-active-underline = ${colors.primary}
label-active-padding = 2

label-occupied = %index%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.card-bg}
label-occupied-padding = 2

label-urgent = %index%
label-urgent-foreground = #ffffff
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %index%
label-empty-foreground = ${colors.foreground-dim}
label-empty-padding = 2

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.time}
format-background = ${colors.card-bg}
format-padding = 2
label = "%date%"
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.cpu}
format-background = ${colors.card-bg}
format-padding = 2
label = "%percentage:2%%"
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.ram}
format-background = ${colors.card-bg}
format-padding = 2
label = "%gb_used% / %gb_total%"
label-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface = wlp3s0
interface-type = wireless
interval = 1.0

format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.net}
format-connected-background = ${colors.card-bg}
format-connected-padding = 2
label-connected = "↓ %downspeed%  ↑ %upspeed%"
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.alert}
format-disconnected-background = ${colors.card-bg}
format-disconnected-padding = 2
label-disconnected = "offline"
label-disconnected-foreground = ${colors.foreground-dim}

[module/traffic-today]
type = custom/script
exec = /home/pluto/.config/polybar/scripts/traffic_today.py
interval = 5
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.data}
format-background = ${colors.card-bg}
format-padding = 2
label = "Today: %output%"
label-foreground = ${colors.foreground}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "
format-prefix-foreground = ${colors.kbd}
format-background = ${colors.card-bg}
format-padding = 2
label-layout = "%layout%"
label-layout-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true
